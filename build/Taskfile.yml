version: '3'

tasks:
  build:frontend:
    dir: frontend
    cmds:
      - npm run build

  generate:icons:
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev
