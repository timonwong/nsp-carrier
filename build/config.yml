version: '3'

info:
  companyName: Theo
  productName: NSP Carrier
  productIdentifier: im.theo.nsp-carrier
  description: An Omni host for NS installers
  copyright: Copyright 2026 Theo
  comments: An Omni host for NS installers
  version: 0.3.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary
