name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  WAILS_VERSION: v2.14.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-2025
            platform: windows/amd64
            artifact: nsp-carrier-windows-amd64
          - name: macOS arm64
            os: macos-15
            platform: darwin/arm64
            artifact: nsp-carrier-macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libusb"
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=C:\msys64\ucrt64\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l ./*.go cmd internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test Go code
        run: go test -count=1 ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Check frontend
        run: npm --prefix frontend run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build Wails application
        run: wails build -clean -m -s -trimpath -platform ${{ matrix.platform }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "nsp-carrier-windows-amd64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "build\bin\nsp-carrier.exe" $stage
          Copy-Item "C:\msys64\ucrt64\bin\libusb-1.0.dll" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "nsp-carrier-windows-amd64.zip"
          $hash = (Get-FileHash "nsp-carrier-windows-amd64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *nsp-carrier-windows-amd64.zip" | Out-File "nsp-carrier-windows-amd64.zip.sha256" -Encoding ascii

      - name: Bundle libusb in macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='build/bin/NSP Carrier.app'
          executable="$app/Contents/MacOS/nsp-carrier"
          frameworks="$app/Contents/Frameworks"
          linked_libusb="$(otool -L "$executable" | awk '/libusb-1\.0/{print $1; exit}')"
          test -n "$linked_libusb"
          mkdir -p "$frameworks"
          cp "$linked_libusb" "$frameworks/libusb-1.0.0.dylib"
          chmod 755 "$frameworks/libusb-1.0.0.dylib"
          install_name_tool -id '@rpath/libusb-1.0.0.dylib' "$frameworks/libusb-1.0.0.dylib"
          install_name_tool -change "$linked_libusb" '@executable_path/../Frameworks/libusb-1.0.0.dylib' "$executable"
          codesign --force --sign - "$frameworks/libusb-1.0.0.dylib"
          codesign --force --deep --sign - "$app"
          otool -L "$executable" | grep -F '@executable_path/../Frameworks/libusb-1.0.0.dylib'
          codesign --verify --deep --strict "$app"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'build/bin/NSP Carrier.app' nsp-carrier-macos-arm64.zip
          shasum -a 256 nsp-carrier-macos-arm64.zip > nsp-carrier-macos-arm64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 7
