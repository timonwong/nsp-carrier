name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-2025
            arch: amd64
            goflags: ''
            artifact: nsp-carrier-windows-amd64
          - name: macOS arm64
            os: macos-15
            arch: arm64
            goflags: ''
            artifact: nsp-carrier-macos-arm64
          - name: Linux amd64
            os: ubuntu-24.04
            arch: amd64
            goflags: '-tags=gtk3'
            artifact: nsp-carrier-linux-amd64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: ${{ matrix.goflags }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libusb-1.0-0-dev pkg-config

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libusb"
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=C:\msys64\ucrt64\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\msys64\ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned toolchain with mise
        id: mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Resolve dependency cache paths
        id: cache-paths
        shell: bash
        run: |
          {
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "gocache=$(go env GOCACHE)"
            echo "pnpmstore=$(pnpm store path)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Go module and build data
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.cache-paths.outputs.gomodcache }}
            ${{ steps.cache-paths.outputs.gocache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-paths.outputs.pnpmstore }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: mise run ui:install

      - name: Check Go formatting
        run: mise run fmt:check

      - name: Check frontend formatting
        run: mise run ui:format:check

      - name: Check Wails bindings
        run: mise run bindings:check

      - name: Test Go code
        run: mise run test

      - name: Vet Go code
        run: mise run vet

      - name: Check frontend
        run: mise run ui:check

      - name: Build frontend
        run: mise run ui:build

      - name: Build Wails application
        run: mise run app:package
        env:
          ARCH: ${{ matrix.arch }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "nsp-carrier-windows-amd64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "bin\nsp-carrier.exe" $stage
          Copy-Item "C:\msys64\ucrt64\bin\libusb-1.0.dll" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "nsp-carrier-windows-amd64.zip"
          $hash = (Get-FileHash "nsp-carrier-windows-amd64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash *nsp-carrier-windows-amd64.zip`n"
          [IO.File]::WriteAllText("$PWD\nsp-carrier-windows-amd64.zip.sha256", $checksum, [Text.Encoding]::ASCII)

      - name: Bundle libusb in macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='bin/NSP Carrier.app'
          executable="$app/Contents/MacOS/nsp-carrier"
          frameworks="$app/Contents/Frameworks"
          linked_libusb="$(otool -L "$executable" | awk '/libusb-1\.0/{print $1; exit}')"
          test -n "$linked_libusb"
          mkdir -p "$frameworks"
          cp "$linked_libusb" "$frameworks/libusb-1.0.0.dylib"
          chmod 755 "$frameworks/libusb-1.0.0.dylib"
          install_name_tool -id '@rpath/libusb-1.0.0.dylib' "$frameworks/libusb-1.0.0.dylib"
          install_name_tool -change "$linked_libusb" '@executable_path/../Frameworks/libusb-1.0.0.dylib' "$executable"
          codesign --force --sign - "$frameworks/libusb-1.0.0.dylib"
          codesign --force --deep --sign - "$app"
          otool -L "$executable" | grep -F '@executable_path/../Frameworks/libusb-1.0.0.dylib'
          codesign --verify --deep --strict "$app"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'bin/NSP Carrier.app' nsp-carrier-macos-arm64.zip
          shasum -a 256 nsp-carrier-macos-arm64.zip > nsp-carrier-macos-arm64.zip.sha256

      - name: Upload artifact
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 7
